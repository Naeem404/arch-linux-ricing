<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Prefer TTF desktop fonts over WOFF2 web fonts so Waybar/Rofi can render glyphs -->
    <selectfont>
        <rejectfont>
            <glob>/usr/share/fonts/WOFF2/*</glob>
        </rejectfont>
    </selectfont>

    <!-- Alias for Waybar: text via FreeSans, icons via FA7 Solid/Brands -->
    <alias>
        <family>WaybarIcons</family>
        <prefer>
            <family>FreeSans</family>
            <family>Font Awesome 7 Free Solid</family>
            <family>Font Awesome 7 Brands</family>
        </prefer>
    </alias>
</fontconfig>
